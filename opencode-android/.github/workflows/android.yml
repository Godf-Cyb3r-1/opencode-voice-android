name: Build OpenCode Local OpenCode 2 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - run: bash scripts/build.sh
      - run: python3 -m unittest discover -s tests -v
      - run: ./gradlew --no-daemon :app:testDebugUnitTest --tests com.termux.app.EnginePayloadTest
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-2-android-arm64-debug
          path: app/build/outputs/apk/debug/*arm64-v8a.apk
          if-no-files-found: error
