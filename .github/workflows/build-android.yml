name: Build OpenCode Voice Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/jarvis-assistant-v1", "feature/kokoro-native-voice"]
    paths:
      - 'opencode-android/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: opencode-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list includes the removed "tools"
          # package, which makes sdkmanager fail on current runners.
          packages: platform-tools
      - name: Install required SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 dpkg-dev unzip zip
      - name: Prepare real offline Kokoro neural model
        run: |
          chmod +x scripts/prepare_kokoro.sh
          bash scripts/prepare_kokoro.sh
          test -s app/src/main/assets/kokoro-en-v0_19/model.onnx
          test -s app/src/main/assets/kokoro-en-v0_19/voices.bin
          test -s app/src/main/assets/kokoro-en-v0_19/tokens.txt
          test -d app/src/main/assets/kokoro-en-v0_19/espeak-ng-data
      - name: Build signed debug APK
        run: |
          chmod +x gradlew scripts/build.sh
          bash scripts/build.sh
          for apk in app/build/outputs/apk/debug/*.apk; do
            unzip -Z -1 "$apk" | grep -F "assets/kokoro-en-v0_19/model.onnx" >/dev/null || { echo "Kokoro model missing from $apk"; exit 1; }
            echo "Verified Kokoro weights packaged in $apk"
          done
      - name: List generated APKs
        if: always()
        run: find app/build/outputs/apk -name '*.apk' -type f -print || true
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Kokoro-Offline-Android-APK
          path: opencode-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
